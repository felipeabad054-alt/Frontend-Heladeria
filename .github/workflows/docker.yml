name: CI-CD Frontend Heladeria

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-heladeria
  cancel-in-progress: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/heladeria-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/heladeria-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar acceso SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar Frontend en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -o BatchMode=yes \
            -i ~/.ssh/github_actions \
            "ubuntu@$EC2_HOST" <<'EOF'

          set -e
          cd /home/ubuntu/Docker-Heladeria

          docker compose \
            --env-file .env.aws \
            -f docker-compose.aws.yml \
            pull frontend

          docker compose \
            --env-file .env.aws \
            -f docker-compose.aws.yml \
            up -d --no-deps --force-recreate frontend

          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            -I http://localhost:5173 > /dev/null

          docker compose \
            --env-file .env.aws \
            -f docker-compose.aws.yml \
            ps frontend
          EOF
      - name: Desplegar Frontend en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -T -o BatchMode=yes \
            -i ~/.ssh/github_actions \
            "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          set -Eeuo pipefail

          cd /home/ubuntu/Docker-Heladeria

          compose() {
            docker compose \
              --env-file .env.aws \
              -f docker-compose.aws.yml \
              "$@"
          }

          echo "Descargando nueva imagen del frontend..."
          compose pull frontend

          echo "Recreando contenedor del frontend..."
          compose up -d --no-deps --force-recreate frontend

          echo "Esperando que el frontend esté disponible..."

          for intento in $(seq 1 20); do
            if curl -fsSI http://localhost:5173 > /dev/null; then
              echo "Frontend funcionando correctamente."
              compose ps frontend
              exit 0
            fi

            echo "Intento $intento de 20: frontend todavía iniciando..."
            sleep 3
          done

          echo "El frontend no respondió después de 60 segundos."
          compose ps frontend
          compose logs --tail=100 frontend
          exit 1
          EOF
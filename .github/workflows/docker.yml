name: CI-CD Frontend Heladeria

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-heladeria-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Publicar imagen en Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen del Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/heladeria-frontend:latest

  test-ssh:
    name: Probar conexion con EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-push

    steps:
      - name: Validar Secrets de EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: El Secret EC2_HOST esta vacio."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: El Secret EC2_SSH_KEY esta vacio."
            exit 1
          fi

          echo "Los Secrets de EC2 estan configurados."

      - name: Preparar acceso SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions_frontend
          chmod 600 ~/.ssh/github_actions_frontend

          ssh-keyscan \
            -T 10 \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Probar conexion SSH con EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/github_actions_frontend \
            "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          set -e

          echo "Conexion SSH correcta."
          echo "Usuario remoto: $(whoami)"
          echo "Servidor remoto: $(hostname)"

          docker --version
          docker compose version

          test -d /home/ubuntu/Docker-Heladeria

          echo "Directorio Docker-Heladeria encontrado."
          EOF

  deploy-frontend:
    name: Desplegar Frontend en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-ssh

    steps:
      - name: Preparar acceso SSH para despliegue
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions_frontend
          chmod 600 ~/.ssh/github_actions_frontend

          ssh-keyscan \
            -T 10 \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Actualizar Frontend en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/github_actions_frontend \
            "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          set -Eeuo pipefail

          cd /home/ubuntu/Docker-Heladeria

          compose() {
            docker compose \
              --env-file .env.aws \
              -f docker-compose.aws.yml \
              "$@"
          }

          echo "Descargando la imagen mas reciente del Frontend..."
          compose pull frontend

          echo "Recreando unicamente el contenedor Frontend..."
          compose up \
            -d \
            --no-deps \
            --force-recreate \
            frontend

          echo "Esperando que el Frontend este disponible..."

          for intento in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 3 \
              --max-time 5 \
              http://localhost:5173 \
              > /dev/null 2>&1
            then
              echo "Frontend funcionando correctamente."

              echo "Variable configurada en el contenedor:"
              compose exec -T frontend printenv VITE_API_URL

              compose ps frontend

              echo "Eliminando imagenes antiguas sin etiqueta..."
              docker image prune -f

              exit 0
            fi

            echo "Intento $intento de 30: Frontend todavia iniciando..."
            sleep 3
          done

          echo "ERROR: El Frontend no respondio despues de 90 segundos."

          compose ps frontend || true
          compose logs --tail=150 frontend || true

          exit 1
          EOF

